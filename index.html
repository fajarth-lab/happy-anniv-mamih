<!DOCTYPE html>

<head>

  <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, & Alex Brush -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pearl: '#FFFFFF',
            champagne: '#EBF9FA',
            roseSoft: '#CBEFF2',
            roseGold: '#2EC4B6',
            roseDeep: '#0D9488',
            charcoal: '#16323B',
            mutedInk: '#4A6B75',
            goldAccent: '#38BDF8',
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            script: ['"Alex Brush"', 'cursive'],
            letter: ['Georgia', 'serif'],
          },
        },
      },
    };

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Strict One-Page View */
      background-color: #ECFAFB;
      color: #16323B;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* =========================================================
       BACKGROUND BENTO-COLLAGE DINAMIS (16 FOTO UKURAN BERVARIASI)
       Semua 16 foto muat 100% penuh dalam 1 layar tanpa celah kosong
    ========================================================== */
    #photoMosaicBg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 6px;
      padding: 6px;
      background: linear-gradient(135deg, #F0FCFD 0%, #D2F3F7 50%, #DCEEFF 100%);
    }

    @media (min-width: 768px) {
      #photoMosaicBg {
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(6, 1fr);
        gap: 8px;
        padding: 8px;
      }
    }

    .mosaic-tile {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 14px;
      background-color: #CBEFF2;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.12);
      cursor: pointer;
    }

    .mosaic-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), filter 0.35s ease;
    }

    .mosaic-tile:hover img {
      transform: scale(1.07);
      filter: brightness(1.04);
    }

    /* Cahaya cerah lembut di tepi layar */
    .soft-glow-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.04) 40%, rgba(203, 239, 242, 0.28) 100%);
    }

    /* =========================================================
       KARTU UTAMA ONE-PAGE BRIGHT GLASS
    ========================================================== */
    .pearl-glass {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 24px 60px rgba(13, 148, 136, 0.16), 0 6px 20px rgba(22, 50, 59, 0.06);
    }

    /* Transisi Mode Fokus Foto */
    #onePageWrapper {
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.photo-focus-mode #onePageWrapper {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spinSlow 8s linear infinite;
    }

    /* Custom scrollbar halus untuk area baca surat */
    .letter-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .letter-scroll::-webkit-scrollbar-track {
      background: rgba(203, 239, 242, 0.45);
      border-radius: 9999px;
    }
    .letter-scroll::-webkit-scrollbar-thumb {
      background: rgba(13, 148, 136, 0.45);
      border-radius: 9999px;
    }

    /* =========================================================
       3D FLIP CARD ANIMATION (POP-UP PILIH HADIAH)
    ========================================================== */
    .gift-perspective {
      perspective: 1000px;
    }
    .gift-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }
    .gift-card.is-flipped .gift-card-inner {
      transform: rotateY(180deg);
    }
    .gift-card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.25rem;
    }
    .gift-card-back {
      transform: rotateY(180deg);
    }
    @keyframes revealPop {
      0% { opacity: 0; transform: scale(0.85) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .gift-card.is-flipped .reveal-content {
      animation: revealPop 0.55s ease forwards 0.25s;
    }
  </style>
</head>
<body class="antialiased selection:bg-roseSoft selection:text-charcoal">

    function createPlaceholderSVG(index) {
      const palettes = [
        ["#E0F7FA", "#0D9488"],
        ["#E0F2FE", "#0284C7"],
        ["#CCFBF1", "#0F766E"],
        ["#F0FDFA", "#14B8A6"]
      ];
      const [bg, fg] = palettes[index % palettes.length];
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600'>
        <rect width='600' height='600' fill='${bg}'/>
        <circle cx='300' cy='260' r='55' fill='${fg}' fill-opacity='0.14'/>
        <text x='50%' y='46%' dominant-baseline='middle' text-anchor='middle' font-size='44'>🩵</text>
        <text x='50%' y='58%' dominant-baseline='middle' text-anchor='middle' font-family='Georgia, serif' font-style='italic' font-size='26' fill='${fg}'>Foto Kita #${index + 1}</text>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function initContent() {
      document.getElementById("heroBadgeText").textContent = CONFIG.badgeAtas;

      const letterContainer = document.getElementById("letterBodyDisplay");
      letterContainer.innerHTML = "";
      CONFIG.isiUcapan.forEach((paragraf, idx) => {
        const p = document.createElement("p");
        p.textContent = paragraf;
        if (idx === 0 || idx === CONFIG.isiUcapan.length - 1) {
          p.className = "font-semibold text-roseDeep text-[16px] sm:text-[17px]";
        }
        letterContainer.appendChild(p);
      });
    }

    function renderBackgroundMosaic() {
      const container = document.getElementById("photoMosaicBg");
      container.innerHTML = "";

      CONFIG.fotos.forEach((item, index) => {
        const tile = document.createElement("div");
        tile.className = `mosaic-tile ${TILE_SPANS[index] || "col-span-2 row-span-1"}`;

        const img = document.createElement("img");
        const basePath = item.src.replace(/\.[^/.]+$/, "");
        const candidateExts = [".jpg", ".JPG", ".jpeg", ".JPEG", ".png", ".PNG"];
        let extAttempt = 0;

        img.src = basePath + candidateExts[extAttempt];
        img.alt = item.caption || `Foto Kenangan ${index + 1}`;
        img.onerror = function () {
          extAttempt++;
          if (extAttempt < candidateExts.length) {
            this.src = basePath + candidateExts[extAttempt];
          } else {
            this.onerror = null;
            this.src = createPlaceholderSVG(index);
          }
        };

        tile.appendChild(img);
        tile.addEventListener("click", () => {
          openLightbox(img.src, item.caption || `Foto Kita #${index + 1}`);
        });

        container.appendChild(tile);
      });
    }

    /* =========================================================
       MODE INTIP FOTO & LIGHTBOX
    ========================================================== */
    function togglePhotoFocusMode() {
      const isFocus = document.body.classList.toggle("photo-focus-mode");
      const bar = document.getElementById("photoFocusBar");
      if (isFocus) {
        bar.classList.remove("hidden");
        bar.classList.add("flex");
      } else {
        bar.classList.add("hidden");
        bar.classList.remove("flex");
      }
    }

    function openLightbox(src, caption) {
      const modal = document.getElementById("photoLightbox");
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightboxCaption").textContent = caption;
      modal.classList.remove("hidden");
    }

    function closeLightbox() {
      document.getElementById("photoLightbox").classList.add("hidden");
    }

    /* =========================================================
       POP-UP PILIH HADIAH (KARTU PORTRAIT TERBALIK & ACAK)
    ========================================================== */
    let hasRevealedGift = false;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function renderGiftCards() {
      hasRevealedGift = false;
      const grid = document.getElementById("giftCardsGrid");
      const instruction = document.getElementById("giftInstructionText");
      instruction.textContent = "Sentuh salah satu kartu tertutup di bawah ini untuk membuka hadiahmu!";
      grid.innerHTML = "";

      const shuffledGifts = shuffleArray(CONFIG.daftarHadiah);

      shuffledGifts.forEach((hadiah, idx) => {
        const cardWrapper = document.createElement("div");
        cardWrapper.className = "gift-card gift-perspective aspect-[3/4] w-full cursor-pointer select-none";

        cardWrapper.innerHTML = `
          <div class="gift-card-inner shadow-md">
            <!-- Sisi Depan (Tertutup) -->
            <div class="gift-card-face bg-gradient-to-br from-roseDeep via-roseGold to-sky-400 text-pearl p-3 flex flex-col items-center justify-center border-2 border-white/80 shadow-inner">
              <div class="w-11 h-11 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center text-2xl mb-2 shadow-sm">
                🎁
              </div>
              <span class="font-letter italic text-sm sm:text-base font-semibold tracking-wide">Kartu #${idx + 1}</span>
              <span class="text-[10px] sm:text-[11px] text-white/90 mt-1">Ketuk untuk buka</span>
            </div>

            <!-- Sisi Belakang (Terbuka / Isi Hadiah) -->
            <div class="gift-card-face gift-card-back bg-gradient-to-b from-white to-champagne text-charcoal p-3 sm:p-4 flex flex-col items-center justify-center border-2 border-roseGold/50 text-center">
              <div class="reveal-content opacity-0 flex flex-col items-center justify-center h-full">
                <span class="text-2xl sm:text-3xl mb-1.5">${hadiah.ikon}</span>
                <h3 class="font-letter italic font-bold text-sm sm:text-base text-roseDeep leading-snug">
                  ${hadiah.judul}
                </h3>
                <p class="font-letter italic text-[11px] sm:text-xs text-charcoal/90 mt-1.5 leading-relaxed">
                  ${hadiah.deskripsi}
                </p>
              </div>
            </div>
          </div>
        `;

        cardWrapper.addEventListener("click", (e) => {
          if (cardWrapper.classList.contains("is-flipped")) return;

          cardWrapper.classList.add("is-flipped");
          triggerHeartBurst(e);

          if (!hasRevealedGift) {
            hasRevealedGift = true;
            instruction.textContent = "Yeay! Ini hadiah spesial untuk sayang 🎉 (Bisa buka kartu lain juga kalau penasaran 😄)";
          }
        });

        grid.appendChild(cardWrapper);
      });
    }

    function openGiftModal() {
      renderGiftCards(); // Otomatis teracak setiap kali pop-up dibuka
      document.getElementById("giftModal").classList.remove("hidden");
    }

    function closeGiftModal() {
      document.getElementById("giftModal").classList.add("hidden");
    }

    function resetGiftCards() {
      renderGiftCards();
    }

    /* =========================================================
       AUDIO / MUSIK LATAR (MP3 CUSTOM ATAU PIANO LEMBUT BAWAAN)
    ========================================================== */
    let isPlaying = false;
    let audioCtx = null;
    let pianoTimer = null;
    let usingFallbackPiano = false;

    function playSoftPianoLoop() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      // Melodi lembut romantis (C major / A minor / F major / G major)
      const chords = [
        [261.63, 329.63, 392.00, 493.88],
        [220.00, 261.63, 329.63, 392.00],
        [174.61, 220.00, 261.63, 349.23],
        [196.00, 246.94, 293.66, 392.00]
      ];
      let step = 0;

      const playStep = () => {
        if (!isPlaying || !usingFallbackPiano) return;
        const chord = chords[step % chords.length];
        const now = audioCtx.currentTime;

        chord.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + i * 0.25);

          gain.gain.setValueAtTime(0.0001, now + i * 0.25);
          gain.gain.exponentialRampToValueAtTime(0.035, now + i * 0.25 + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.25 + 2.4);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.25);
          osc.stop(now + i * 0.25 + 2.5);
        });

        step++;
        pianoTimer = setTimeout(playStep, 2600);
      };

      playStep();
    }

    function stopSoftPianoLoop() {
      if (pianoTimer) {
        clearTimeout(pianoTimer);
        pianoTimer = null;
      }
    }

    function updateMusicUI(playing) {
      const icon = document.getElementById("vinylIcon");
      const text = document.getElementById("musicStatusText");
      if (playing) {
        icon.classList.add("animate-spin-slow");
        text.textContent = "Jeda Lagu";
      } else {
        icon.classList.remove("animate-spin-slow");
        text.textContent = "Putar Lagu";
      }
    }

    function toggleMusic() {
      const audioEl = document.getElementById("bgAudio");

      if (isPlaying) {
        isPlaying = false;
        audioEl.pause();
        stopSoftPianoLoop();
        updateMusicUI(false);
        return;
      }

      isPlaying = true;
      updateMusicUI(true);

      if (!usingFallbackPiano && CONFIG.fileMusik) {
        if (!audioEl.src) {
          audioEl.src = CONFIG.fileMusik;
        }
        audioEl.play().catch(() => {
          usingFallbackPiano = true;
          playSoftPianoLoop();
        });
      } else {
        usingFallbackPiano = true;
        playSoftPianoLoop();
      }
    }

    /* =========================================================
       ANIMASI PELUK VIRTUAL & PARTIKEL CAHAYA AMBIENT
    ========================================================== */
    const particles = [];

    function triggerHeartBurst(event) {
      let x = window.innerWidth / 2;
      let y = window.innerHeight / 2;

      if (event && event.currentTarget && event.currentTarget.getBoundingClientRect) {
        const rect = event.currentTarget.getBoundingClientRect();
        x = rect.left + rect.width / 2;
        y = rect.top + rect.height / 2;
      } else if (event && event.clientX) {
        x = event.clientX;
        y = event.clientY;
      }

      const emojis = ["🩵", "❤️", "✨", "💙", "🤍", "🫂"];

      for (let i = 0; i < 24; i++) {
        const angle = (Math.PI * 2 * i) / 24 + (Math.random() - 0.5) * 0.4;
        const speed = 2.6 + Math.random() * 4.8;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.2,
          alpha: 1,
          size: 20 + Math.random() * 14,
          emoji: emojis[i % emojis.length],
          burst: true
        });
      }
    }

    function initAmbientCanvas() {
      const canvas = document.getElementById("ambientCanvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      // Partikel cahaya mengambang lembut
      for (let i = 0; i < 24; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: -0.25 - Math.random() * 0.45,
          alpha: 0.25 + Math.random() * 0.4,
          size: 2.5 + Math.random() * 3.5,
          burst: false
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.burst) {
            p.vy += 0.06;
            p.alpha -= 0.016;
            if (p.alpha <= 0) {
              particles.splice(i, 1);
              continue;
            }
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.font = `${p.size}px sans-serif`;
            ctx.textAlign = "center";
            ctx.fillText(p.emoji, p.x, p.y);
            ctx.restore();
          } else {
            if (p.y < -10) {
              p.y = canvas.height + 10;
              p.x = Math.random() * canvas.width;
            }
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        requestAnimationFrame(animate);
      }

      animate();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initContent();
      renderBackgroundMosaic();
      initAmbientCanvas();
    });
  </script>
</body>
